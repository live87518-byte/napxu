<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="./favicon.png?v=2">
<title>Nạp Robux - Premium</title>

<style>
:root {
    --primary: #ff7a00;
    --primary-hover: #e66e00;
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --input-bg: #0b0f19;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --success: #10b981;
    --error: #ef4444;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    background: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    line-height: 1.5;
}

/* Header */
.header {
    background: #111827;
    padding: 15px 20px;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: 2px;
    border-bottom: 2px solid #1e293b;
}

/* Banner */
.banner {
    background: linear-gradient(135deg, #1e1b4b 0%, #311005 100%);
    position: relative;
    padding: 60px 20px;
    text-align: center;
    overflow: hidden;
    border-bottom: 1px solid #2e1005;
}

.banner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle, rgba(255,122,0,0.15) 0%, transparent 70%);
    pointer-events: none;
}

.banner h1 {
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 10px rgba(255, 122, 0, 0.3);
    margin-bottom: 8px;
}

.banner p {
    color: var(--text-muted);
    font-size: 16px;
    letter-spacing: 1px;
}

/* Container & Card */
.container {
    max-width: 680px;
    margin: 40px auto;
    padding: 0 20px;
}

.card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.05);
}

h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 24px;
    position: relative;
    padding-left: 12px;
}

h2::before {
    content: '';
    position: absolute;
    left: 0; top: 4px; bottom: 4px;
    width: 4px;
    background: var(--primary);
    border-radius: 2px;
}

/* Inputs */
label {
    display: block;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 500;
}

.input-group {
    margin-bottom: 24px;
}

input {
    width: 100%;
    padding: 14px 16px;
    background: var(--input-bg);
    color: white;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    font-size: 15px;
    transition: all 0.3s;
}

input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.2);
}

/* Packages Grid */
.packages {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
}

.package {
    background: var(--input-bg);
    padding: 20px 15px;
    text-align: center;
    border-radius: 12px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}

.package:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 122, 0, 0.4);
    background: #111a2e;
}

.package .diamonds {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
}

.package .price {
    font-size: 14px;
    color: var(--primary);
    font-weight: 600;
}

.package.active {
    border-color: var(--primary);
    background: rgba(255, 122, 0, 0.08);
    box-shadow: 0 4px 20px rgba(255, 122, 0, 0.15);
}

/* Button */
button {
    width: 100%;
    background: var(--primary);
    color: white;
    padding: 16px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 12px rgba(255, 122, 0, 0.3);
}

button:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(255, 122, 0, 0.4);
}

button:active {
    transform: translateY(1px);
}

/* Status Messages */
#message {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    display: none; /* Ẩn mặc định, hiện bằng JS */
    text-align: center;
}

#message.error {
    display: block;
    background: rgba(239, 68, 68, 0.1);
    color: var(--error);
    border: 1px solid rgba(239, 68, 68, 0.2);
}

#message.success {
    display: block;
    background: rgba(16, 185, 129, 0.1);
    color: var(--success);
    border: 1px solid rgba(16, 185, 129, 0.2);
    text-align: left;
    padding: 20px;
}
</style>
  <style>
    /* Khung nền mờ phía sau popup */
    .overlay {
      display: none; /* Mặc định ẩn */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* Khung nội dung của Popup */
    .popup-content {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      position: relative;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* Nút dấu X để đóng */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
      color: #aaa;
    }

    .close-btn:hover {
      color: #333;
    }
  </style>
</head>
<body>
      <!-- Nút bấm để mở Popup -->
  <button id="open-btn" style="padding: 10px 20px; cursor: pointer;">Mở Popup</button>

  <!-- Cấu trúc ẩn của Popup -->
  <div id="popup-overlay" class="overlay">
    <div class="popup-content">
      <span class="close-btn" id="close-btn">&times;</span>
      <h2>Thông báo!</h2>
      <p>Nội dung popup của bạn nằm ở đây.</p>
    </div>
  </div>

<script src="./config.js"></script>
<script src="./main.js"></script>
<div class="header">
    VNG TopUp
</div>

<div class="banner">
    <h1>💎 NẠP ROBUX</h1>
    <p>Nhanh chóng • An toàn • Tự động 24/7</p>
</div>

<div class="container">
    <div class="card">

        <h2>Thông Tin Nạp Tiền</h2>

        <div class="input-group">
            <label for="uid">User Name</label>
            <input type="text" id="uid" placeholder="Nhập Tên Tài Khoản">
        </div>

        <div class="input-group">
            <label>Chọn gói Robux</label>
            <div class="packages">
                <div class="package" data-package="40 ROBUX - FAST">
                    <div class="diamonds">💎 40 ROBUX</div>
                    <div class="price">FAST</div>
                </div>
                <div class="package" data-package="55 ROBUX - FAST">
                    <div class="diamonds">💎 55 ROBUX</div>
                    <div class="price">FAST</div>
                </div>
                <div class="package" data-package="80 ROBUX - FAST">
                    <div class="diamonds">💎 80 ROBUX</div>
                    <div class="price">FAST</div>
                </div>
                <div class="package" data-package="300 ROBUX - FAST">
                    <div class="diamonds">300 ROBUX</div>
                    <div class="price">FAST</div>
                </div>
           
        </div>

        <div class="input-group">
            <label for="otp">Mã xác thực OTP</label>
<a href="https://link4m.org/ivCayn" style="text-decoration: none;">
    <button style="background-color: #008CBA; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer;">
        Lấy OTP
    </button>
</a>
</div>
            <input type="text" id="otp" placeholder="Nhập mã OTP gồm 6 chữ số">
        </div>

        <button onclick="xacNhan()">
            XÁC NHẬN NẠP NGAY
        </button>

        <div id="message"></div>

    </div>
</div>

<script>
const OTP_CO_SAN = "100211";
let selectedPackage = "";

document.querySelectorAll(".package").forEach(item => {
    item.addEventListener("click", () => {
        document.querySelectorAll(".package").forEach(x => x.classList.remove("active"));
        item.classList.add("active");
        selectedPackage = item.getAttribute("data-package");
    });
});

function xacNhan() {
    const uid = document.getElementById("uid").value.trim();
    const otp = document.getElementById("otp").value.trim();
    const message = document.getElementById("message");

    // Reset class trạng thái
    message.className = "";

    if (uid === "") {
        message.innerHTML = "❌ Vui lòng nhập UID tài khoản của bạn.";
        message.classList.add("error");
        return;
    }

    if (selectedPackage === "") {
        message.innerHTML = "❌ Bạn chưa chọn gói vật phẩm cần nạp.";
        message.classList.add("error");
        return;
    }

    if (otp !== OTP_CO_SAN) {
        message.innerHTML = "❌ Mã xác thực OTP không chính xác. Vui lòng thử lại.";
        message.classList.add("error");
        return;
    }

    // Hiển thị dạng hóa đơn thành công lịch sự
    message.innerHTML = `
        <strong style="font-size: 16px; display: block; margin-bottom: 8px;">✅ Giao dịch thành công!</strong>
        <span style="color: #94a3b8;">Hệ thống đang xử lý robux vào tài khoản.</span>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 12px 0;">
        <p><strong>Tài Khoản:</strong> ${uid}</p>
        <p><strong>Gói nạp:</strong> ${selectedPackage}</p>
    `;
    message.classList.add("success");
}
</script>
  <script>
    const openBtn = document.getElementById('open-btn');
    const closeBtn = document.getElementById('close-btn');
    const popup = document.getElementById('popup-overlay');

    if (openBtn && closeBtn && popup) {
      // Mở popup
      openBtn.addEventListener('click', () => {
        popup.style.display = 'flex';
      });

      // Đóng bằng nút X
      closeBtn.addEventListener('click', () => {
        popup.style.display = 'none';
      });

      // Đóng khi bấm ra ngoài vùng đen
      window.addEventListener('click', (e) => {
        if (e.target === popup) {
          popup.style.display = 'none';
        }
      });
    }
  </script>

</body>
</html>
